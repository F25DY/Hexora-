<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexora</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <main>
        <section class="login">
            <header>
                <img src="/static/imagen/logo.png" alt="Hexora">
                <h1>Hexora</h1>
                <p>Plataforma de Gestión de Vulnerabilidades</p>
            </header>

            <form class="form-login" action="dashboard" method="get">
                <div class="campo-grupo">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="email" placeholder="usuario@gmail.com" required>
                </div>
                <div class="campo-grupo">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primario">Iniciar Sesión</button>
            </form>

            <a href="#" class="enlace-olvido">¿Olvidaste tu contraseña?</a>
        </section>
    </main>

    <footer class="pie-pagina-login">
        <p>Secure Access &bull; Encrypted Connection</p>
    </footer>
</body>
</html>
