<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexora - Proyectos</title>
    <link rel="stylesheet" href="/static/css/style.css">
    
</head>
<body>
    <aside class="sidebar">
        <div class="logo-plataforma">
            <div class="textos-marca">
                <img src="/static/imagen/logo.png" width="40" alt="Logo">
                <span class="nombre-completo">Hexora</span>
            </div>
        </div>

        <nav class="menu">
            <ul>
                <li>
                    <a href="dashboard" class="enlace-menu activo">
                        <i class="fa-solid fa-house"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="proyectos.html" class="enlace-menu">
                        <i class="fa-solid fa-folder-closed"></i> Proyectos
                    </a>
                </li>
            </ul>
        </nav>

        <div class="contenedor-usuario">
            <div class="info-perfil">
                <div class="avatar-usuario">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div class="datos-texto">
                    <span class="nombre-usuario">Analista</span>
                    <span class="correo-usuario">analista@gmail.com</span>
                </div>
            </div>
            <a href="index.html" class="boton-cerrar-sesion">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
            </a>
        </div>
    </aside>

    <main class="contenido-principal">
        <header class="barra-superior">
            <h1 class="titulo-principal">Gestión de Proyectos</h1>
            <div class="contenedor-notificaciones">
                <i class="fa-solid fa-bell"></i>
                <span class="punto-alerta"></span>
            </div>
        </header>

        <section class="cabecera-gestion">
            <div class="texto-cabecera">
                <h2 class="titulo-interno">Gestión de Proyectos</h2>
                <p class="subtitulo">Administra tus proyectos de auditoría y pentesting</p>
            </div>

            <button class="btn-crear" type="button">
                <a th:href="@{/proyectos/nuproyectos}">Crear Proyecto</a>
            </button>
        </section>

        <section class="tarjeta-blanca contenedor-busqueda">
            <div class="campo-busqueda">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Buscar proyectos por nombre o empresa...">
            </div>
        </section>

        <section class="tabla-contenedor tarjeta-blanca">
            <table class="tabla-hexora">
                <thead>
                    <tr>
                        <th>Proyecto</th>
                        <th>Empresa</th>
                        <th>Estado</th>
                        <th>Departamentos</th>
                        <th>Vulnerabilidades</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla"></tbody>
            </table>
        </section>
    </main>

    <script>
        function cargarProyectos() {
            const cuerpoTabla = document.getElementById('cuerpo-tabla');
            const proyectos = JSON.parse(localStorage.getItem('proyectosHexora')) || [];

            cuerpoTabla.innerHTML = '';

            proyectos.forEach((proy, index) => {
                const fila = document.createElement('tr');
                let claseEstado = 'badge-azul';

                if (proy.estado === 'Completado') {
                    claseEstado = 'badge-verde';
                } else if (proy.estado === 'Planificado') {
                    claseEstado = 'badge-gris';
                }

                fila.innerHTML = `
                    <td class="nombre-destacado">${proy.nombre}</td>
                    <td class="texto-empresa"><i class="fa-solid fa-building"></i> ${proy.empresa}</td>
                    <td><span class="badge ${claseEstado}">${proy.estado}</span></td>
                    <td>${proy.departamentos}</td>
                    <td class="vulns-info">
                        ${proy.vulnerabilidades}
                        <span class="criticas-text"><i class="fa-solid fa-circle-exclamation"></i> ${proy.criticas} críticas</span>
                    </td>
                    <td>
                        <button class="btn-eliminar" onclick="eliminarProyecto(${index})" type="button">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;

                cuerpoTabla.appendChild(fila);
            });
        }

        function eliminarProyecto(index) {
            const proyectos = JSON.parse(localStorage.getItem('proyectosHexora')) || [];
            proyectos.splice(index, 1);
            localStorage.setItem('proyectosHexora', JSON.stringify(proyectos));
            cargarProyectos();
        }

        document.addEventListener('DOMContentLoaded', cargarProyectos);
    </script>
</body>
</html>
