<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexora - Nuevo Proyecto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo-plataforma">
            <div class="textos-marca">
                <img th:src="@{/imagen/logo.png}" width="40" alt="Logo">
                <span class="nombre-completo">Hexora</span>
            </div>
        </div>

        <nav class="menu">
            <ul>
                <li>
                    <a th:href="@{/inicio}" class="enlace-menu">
                        <i class="fa-solid fa-house"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a th:href="@{/proyectos}" class="enlace-menu activo">
                        <i class="fa-solid fa-folder-closed"></i> Proyectos
                    </a>
                </li>
            </ul>
        </nav>

        <div class="contenedor-usuario">
            <div class="info-perfil">
                <div class="avatar-usuario">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <div class="datos-texto">
                    <span class="nombre-usuario" th:text="${usuario.nombre}">Analista</span>
                    <span class="correo-usuario" th:text="${usuario.correo}">analista@gmail.com</span>
                </div>
            </div>
            <a th:href="@{/logout}" class="boton-cerrar-sesion">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
            </a>
        </div>
    </aside>

    <main class="contenido-principal">

        <header class="encabezado-retorno">
            <a th:href="@{/proyectos}" class="link-volver">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="titulos-nuevo">
                <h1 class="titulo-pagina">Crear Nuevo Proyecto</h1>
                <p class="subtitulo">Configura un nuevo proyecto de auditoría o pentesting</p>
            </div>
        </header>

        <section class="tarjeta-blanca contenedor-formulario">
            <h3 class="seccion-form-titulo">Información Básica</h3>

            <form th:action="@{/proyectos/guardar}" th:object="${proyectoForm}" method="post" class="form-proyecto">

                <div class="grid-form">
                    <div class="campo-grupo">
                        <label>Nombre del Proyecto <span class="requerido">*</span></label>
                        <input type="text" th:field="*{nombre}" placeholder="Ej: Auditoría Sistema Bancario" required>
                    </div>

                    <div class="campo-grupo">
                        <label>Empresa / Auditoría <span class="requerido">*</span></label>
                        <input type="text" th:field="*{empresa}" placeholder="Ej: Banco Nacional" required>
                    </div>

                    <div class="campo-grupo">
                        <label>Fecha de Inicio <span class="requerido">*</span></label>
                        <input type="date" th:field="*{fechaInicio}" required>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label>Descripción <span class="requerido">*</span></label>
                    <textarea th:field="*{descripcion}" rows="4" placeholder="Describe el alcance y objetivos del proyecto" required></textarea>
                </div>

                <div class="campo-grupo">
                    <label>Estado <span class="requerido">*</span></label>
                    <select th:field="*{estado}" required>
                        <option value="">Seleccionar estado</option>
                        <option value="Planificado">Planificado</option>
                        <option value="En Progreso">En progreso</option>
                        <option value="Completado">Completado</option>
                    </select>
                </div>

                <div class="acciones-formulario">
                    <a th:href="@{/proyectos}">
                        <button type="button" class="btn-cancelar">Cancelar</button>
                    </a>
                    <button type="submit" class="btn-guardar">
                        <i class="fa-solid fa-floppy-disk"></i> Crear Proyecto
                    </button>
                </div>

            </form>
        </section>
    </main>

</body>
</html>
