<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexora - Nuevo Departamento</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="app-page">

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="logo-plataforma">
            <div class="marca-simple">
                <i class="fa-solid fa-shield"></i> Hexora
            </div>
        </div>
        <nav class="menu">
            <ul>
                <li>
                    <a href="dashboard.html" th:href="@{/dashboard}" class="enlace-menu">
                        <i class="fa-solid fa-house"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a href="proyectos.html" th:href="@{/proyectos}" class="enlace-menu activo">
                        <i class="fa-solid fa-folder-closed"></i> Proyectos
                    </a>
                </li>
            </ul>
        </nav>
        <div class="contenedor-usuario">
            <div class="info-perfil">
                <div class="avatar-usuario">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="datos-texto">
                    <span class="nombre-usuario">Analista</span>
                    <span class="correo-usuario">analista@gmail.com</span>
                </div>
            </div>
            <a href="index.html" th:href="@{/logout}" class="boton-cerrar-sesion">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesion
            </a>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="contenido-principal">

        <header class="encabezado-retorno">
            <a href="proyectos.html" th:href="@{/proyectos}" class="link-volver">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="titulos-nuevo">
                <h1 class="titulo-pagina">Agregar Nuevo Departamento</h1>
                <p class="subtitulo">Crea un departamento para organizar las vulnerabilidades del proyecto</p>
            </div>
        </header>

        <section class="tarjeta-blanca tarjeta-formulario">
            <h3 class="seccion-form-titulo">Informacion del Departamento</h3>

            <form method="post" class="form-proyecto">

                <div class="campo-grupo">
                    <label>Nombre del Departamento <span class="requerido">*</span></label>
                    <input type="text"
                           name="nombre"
                           placeholder="Ej: Aplicaciones Web, API REST, Infraestructura"
                           required>
                </div>

                <div class="campo-grupo">
                    <label>Descripcion <span class="requerido">*</span></label>
                    <textarea name="descripcion"
                              rows="5"
                              placeholder="Describe el alcance y area de este departamento..."
                              required></textarea>
                </div>

                <div class="acciones-formulario">
                    <button type="button" onclick="window.location.href='proyectos.html'" class="btn-cancelar">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-guardar">
                        <i class="fa-solid fa-floppy-disk"></i> Crear Departamento
                    </button>
                </div>

            </form>
        </section>

    </main>

</body>
</html>
