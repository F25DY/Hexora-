<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexora</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
</head>
<body>
    <main>
        <section class="login">
            <header>
                <img th:src="@{/imagen/logo.png}" alt="Logo Hexora">
                <h1>Hexora</h1>
                <p>Plataforma de Gestión de Vulnerabilidades</p>
            </header>

            <form action="index.html" th:action="@{/login}" method="post">

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="usuario@gmail.com" required>

                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="password" placeholder="••••••••" required>

                <!-- Mensaje de error si las credenciales son incorrectas -->
                <p th:if="${error}" th:text="${error}" class="mensaje-error"></p>

                <button type="submit">Iniciar Sesión</button>

            </form>

            <a href="index.html" th:href="@{/recuperar-contrasena}">¿Olvidaste tu contraseña?</a>

        </section>
    </main>

    <footer class="pie-pagina-login">
        <p>Secure Access &bull; Encrypted Connection</p>
    </footer>
</body>
</html>
