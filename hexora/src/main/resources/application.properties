spring.application.name=hexora
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3307/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=true

hexora.network.connect-timeout-millis=${NETWORK_CONNECT_TIMEOUT_MS:500}
hexora.network.monitor-interval-ms=${NETWORK_MONITOR_INTERVAL_MS:30000}
hexora.network.discovery-interval-ms=${NETWORK_DISCOVERY_INTERVAL_MS:30000}
hexora.network.discovery-enabled=${NETWORK_DISCOVERY_ENABLED:true}
hexora.network.default-ports=${NETWORK_DEFAULT_PORTS:21,22,25,53,80,110,143,443,3306,5432}
# Configure authorized targets with hexora.network.allowed-hosts[0].name/address
# in this file or an external deployment configuration.
