<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexora - Crear Proyecto</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
     <aside class="sidebar">
        <div class="logo-plataforma">
            <div class="textos-marca">
                <img src="/static/imagen/logo.png" width="40" alt="Logo">
                <span class="nombre-completo">Hexora</span>
            </div>
        </div>

        <nav class="menu">   
            <ul>
                <li>
                    <a href="inicio.html" class="enlace-menu activo">
                        <i class="fa-solid fa-house"></i> Dashboard 
                    </a>
                </li>
                <li>
                    <a href="proyectos.html" class="enlace-menu">
                        <i class="fa-solid fa-folder-closed"></i> Proyectos
                    </a>
                </li>
            </ul>
        </nav>

        <div class="contenedor-usuario">
            <div class="info-perfil">
                <div class="avatar-usuario">
                    <i class="fa-solid fa-user-shield"></i> 
                </div>
                <div class="datos-texto">
                    <span class="nombre-usuario">Analista</span>
                    <span class="correo-usuario">analista@gmail.com</span>
                </div>
            </div>
           <a href="index.html" class="boton-cerrar-sesion">
    <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
</a>
        </div>
    </aside>
    
    <main class="contenido-principal">
        
        <header class="encabezado-retorno">
            <a href="proyectos.html" class="link-volver">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <div class="titulos-nuevo">
                <h1 class="titulo-pagina">Crear Nuevo Proyecto</h1>
                <p class="subtitulo">Configura un nuevo proyecto de auditoría o pentesting</p>
            </div>
        </header>

        <section class="tarjeta-blanca contenedor-formulario">
            <h3 class="seccion-form-titulo">Información Básica</h3>
            
            <form id="form-nuevo-proyecto" class="form-proyecto">
                <div class="grid-form">
                    <div class="campo-grupo">
                        <label>Nombre del Proyecto <span class="requerido">*</span></label>
                        <input type="text" id="nombreProyecto" placeholder="Ej: Auditoría Sistema Bancario" required>
                    </div>

                    <div class="campo-grupo">
                        <label>Empresa / Auditoría <span class="requerido">*</span></label>
                        <input type="text" id="empresaProyecto" placeholder="Ej: Banco Nacional" required>
                    </div>

                    <div class="campo-grupo">
                        <label>Fecha de Inicio <span class="requerido">*</span></label>
                        <input type="date" id="fechaProyecto" required>
                    </div>
                </div>

                <div class="campo-grupo">
                    <label>Descripción <span class="requerido">*</span></label>
                    <textarea id="descripcionProyecto" rows="4" placeholder="Describe el alcance y objetivos del proyecto" required></textarea>
                </div>

                <div class="campo-grupo">
                    <label>Estado <span class="requerido">*</span></label>
                    <select id="estadoProyecto" required>
                        <option value="">Seleccionar estado</option>
                        <option value="Planificado">Planificado</option>
                        <option value="En Progreso">En progreso</option>
                        <option value="Completado">Completado</option>
                    </select>
                </div>

                <div class="acciones-formulario">
                    <button type="button" class="btn-cancelar" onclick="window.location.href='proyectos.html'">
                        Cancelar
                    </button>
                    <button type="submit" class="btn-guardar">
                        <i class="fa-solid fa-floppy-disk"></i> Crear Proyecto
                    </button>
                </div>
            </form>
        </section>
    </main>
    <script>
    document.getElementById('form-nuevo-proyecto').addEventListener('submit', function(e) {
        e.preventDefault(); // Evita que la página se recargue

        // Capturamos lo que el usuario escribió
        const nuevoProyecto = {
            nombre: document.getElementById('nombreProyecto').value,
            empresa: document.getElementById('empresaProyecto').value,
            estado: document.getElementById('estadoProyecto').value,
            // Datos aleatorios para que la tabla no se vea vacía
            departamentos: Math.floor(Math.random() * 5) + 1,
            vulnerabilidades: Math.floor(Math.random() * 15) + 5,
            criticas: Math.floor(Math.random() * 4)
        };

        // Obtenemos la lista actual de la memoria (o una vacía si no hay nada)
        let proyectos = JSON.parse(localStorage.getItem('proyectosHexora')) || [];

        // Guardamos el nuevo proyecto en la lista
        proyectos.push(nuevoProyecto);

        // Actualizamos la memoria del navegador
        localStorage.setItem('proyectosHexora', JSON.stringify(proyectos));

        // Saltamos a la página de la tabla
        window.location.href = 'proyectos.html';
    });
</script>

    
</body>
</html>
